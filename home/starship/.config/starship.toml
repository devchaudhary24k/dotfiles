format = """
[](user)\
$python\
$username\
[](bg:directory fg:user)\
$directory\
[](fg:directory bg:git)\
$git_branch\
$git_status\
[](fg:git bg:language)\
$c\
$elixir\
$elm\
$golang\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
[](fg:language bg:docker)\
$docker_context\
[](fg:docker bg:time)\
$time\
[ ](fg:time)\
"""
command_timeout = 5000

# The prompt is the same on every machine; only its colours differ, so the
# machine you are on shows at a glance. fish (conf.d/90-tools.fish) starts
# Starship with the palette named after this machine's hostname, falling back
# to the one set here. Add a [palettes.<hostname>] table for a new machine.
palette = "nukebyte"

[palettes.nukebyte] # reds
user = "#3B0A0A"
directory = "#571010"
git = "#7F1D1D"
language = "#DC2626"
docker = "#B91C1C"
time = "#991B1B"

[palettes.carbon] # teals, like the electrons in carbon's fastfetch logo
user = "#042F2E"
directory = "#0A3F3B"
git = "#134E4A"
language = "#0D9488"
docker = "#0F766E"
time = "#115E59"

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like  to save some space
[username]
show_always = true
style_user = "bg:user"
style_root = "bg:user"
format = '[$user ]($style)'

[directory]
style = "bg:directory"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = "  "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important  " = "  "

[c]
symbol = " "
style = "bg:language"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:docker"
format = '[ $symbol $context ]($style)$path'

[elixir]
symbol = " "
style = "bg:language"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:language"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:git"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:git"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:language"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:language"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:language"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:language"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:language"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = " "
style = "bg:language"
format = '[ $symbol ($version) ]($style)'

[python]
style = "bg:user"
format = '[(\($virtualenv\) )]($style)'

[rust]
symbol = ""
style = "bg:language"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:time"
format = '[ $time ]($style)'
