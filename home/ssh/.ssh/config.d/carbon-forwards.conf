# Port-forward inventory for the carbon SSH host.
# Both endpoints are loopback-only: local laptop first, Carbon second.
Host carbon
    ExitOnForwardFailure no

    LocalForward 127.0.0.1:3000 127.0.0.1:3000
    LocalForward 127.0.0.1:3001 127.0.0.1:3001
    LocalForward 127.0.0.1:3002 127.0.0.1:3002
    LocalForward 127.0.0.1:3003 127.0.0.1:3003
    LocalForward 127.0.0.1:3004 127.0.0.1:3004
    LocalForward 127.0.0.1:3005 127.0.0.1:3005
    LocalForward 127.0.0.1:5000 127.0.0.1:5000
    LocalForward 127.0.0.1:5001 127.0.0.1:5001
    LocalForward 127.0.0.1:5002 127.0.0.1:5002
    LocalForward 127.0.0.1:5003 127.0.0.1:5003
    LocalForward 127.0.0.1:5004 127.0.0.1:5004
    LocalForward 127.0.0.1:5005 127.0.0.1:5005
    LocalForward 127.0.0.1:4173 127.0.0.1:4173
    LocalForward 127.0.0.1:4321 127.0.0.1:4321
    LocalForward 127.0.0.1:6006 127.0.0.1:6006
