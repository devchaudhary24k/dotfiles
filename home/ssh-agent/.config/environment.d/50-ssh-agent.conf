# Read by systemd when the desktop session starts, so every program in it
# (fish, VS Code, git GUIs) uses the same ssh-agent, and passphrase prompts
# outside a terminal go through ksshaskpass, which can keep them in KWallet.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket
SSH_ASKPASS=/usr/bin/ksshaskpass
